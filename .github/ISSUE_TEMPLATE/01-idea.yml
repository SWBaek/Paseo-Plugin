name: 아이디어
description: 새로운 플러그인, 기능 또는 개선 방향을 제안합니다.
title: "[Idea] "
labels:
  - idea
  - needs-triage
projects:
  - SWBaek/1
body:
  - type: markdown
    attributes:
      value: |
        아직 구현 방법이 확정되지 않은 제안도 괜찮습니다. 먼저 해결하려는 문제와 기대 효과를 적어 주세요.

  - type: dropdown
    id: target
    attributes:
      label: 대상
      description: 아이디어가 영향을 주는 범위를 선택해 주세요.
      options:
        - workspace 전체
        - paseo-plugin
        - branch-garden
        - github-project-board
        - tailscale-dashboard
        - composer-compact
        - composer-skills
        - 새 플러그인
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 배경과 문제
      description: 어떤 불편이나 기회 때문에 이 아이디어가 필요한가요?
      placeholder: 현재 상황과 해결하려는 문제를 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안
      description: 생각하고 있는 해결 방향을 설명해 주세요.
      placeholder: 구체적인 UI나 구현 방식이 정해지지 않았다면 원하는 동작만 적어도 됩니다.
    validations:
      required: true

  - type: textarea
    id: value
    attributes:
      label: 기대 효과
      description: 이 아이디어가 실현되면 무엇이 좋아지나요?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 대안과 참고 자료
      description: 검토한 다른 방법, 관련 Issue, 문서 또는 예제가 있다면 적어 주세요.
    validations:
      required: false
